name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CozyPulse-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CozyPulse.apk
          gh release create "build-${{ github.run_number }}" CozyPulse.apk \
            --title "Cozy Pulse build ${{ github.run_number }}" \
            --notes "Download CozyPulse.apk on your phone and open it to install." \
            --latest
